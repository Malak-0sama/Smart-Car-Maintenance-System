{% extends "base.html" %}
{% block title %}Confirm Appointment{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:0 auto;">
    <h2>Confirm Appointment?</h2>
    <p>{{ appointment.vehicle }} — {{ appointment.service_type }} on {{ appointment.scheduled_at }}</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn" type="submit">Yes, Confirm</button>
        <a href="{% url 'vehicles:appointment_list' %}" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
